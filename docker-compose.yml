version: "3.9"

services: 
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: demo_db
      DB_USER: postgres
      DB_PASSWORD: Anviam123
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Anviam123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
